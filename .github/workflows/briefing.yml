# .github/workflows/briefing.yml
#
# Runs the morning briefing on a schedule, commits the HTML output to docs/,
# and deploys to GitHub Pages.
#
# Setup (one-time):
#   1. Fork this repo
#   2. Go to Settings → Secrets → Actions → New repository secret
#      Name:  ANTHROPIC_API_KEY
#      Value: sk-ant-...
#   3. Go to Settings → Pages → Source: GitHub Actions
#   4. Edit config.yaml with your topics and sources
#   5. Push — your next scheduled run will generate a live briefing
#
# Manual trigger: Actions tab → Morning Briefing → Run workflow

name: Morning Briefing

on:
  schedule:
    # 5:30 AM GMT (UTC+0, Oct–Mar)
    - cron: '30 5 * * 1-5'
    # 5:30 AM BST (UTC+1, Mar–Oct)
    # The "already exists" check in the script prevents the second run doing any work.
    - cron: '30 4 * * 1-5'

  # Manual trigger — tick "Force regenerate" to rebuild today's briefing even if it already exists
  workflow_dispatch:
    inputs:
      force:
        description: 'Force regenerate today even if already exists'
        type: boolean
        default: false

permissions:
  contents: write   # to commit the generated HTML back to the repo
  pages: write      # to deploy to GitHub Pages
  id-token: write   # required by actions/deploy-pages

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can push back to the same branch
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create output directory
        run: mkdir -p docs

      - name: Copy static assets
        run: |
          [ -f setup.html ] && cp setup.html docs/setup.html || true

      - name: Generate briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEFING_OUTPUT_DIR: docs
          BRIEFING_PROFILE: economy
        run: python morning_dashboard_v4.py ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Commit generated files
        run: |
          git config user.name  "Morning Briefing Bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add docs/
          # Only commit if there are actual changes (idempotent on re-runs)
          git diff --staged --quiet || git commit -m "Briefing: $(date -u +%Y-%m-%d)"
          git push

      # ── GitHub Pages deployment ────────────────────────────────────────────
      # Pages serves from docs/ — the index.html redirect always points to
      # today's file, so https://<user>.github.io/<repo>/ loads today's briefing.

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
