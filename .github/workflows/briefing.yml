# .github/workflows/briefing.yml
#
# Runs the morning briefing on a schedule, commits the HTML output to docs/,
# and deploys to GitHub Pages.
#
# Setup (one-time):
#   1. Fork this repo
#   2. Settings → Secrets → Actions → New repository secret
#        CLAUDE_CODE_OAUTH_TOKEN  = <from `claude setup-token`>  (Pro subscription)
#        ANTHROPIC_API_KEY        = sk-ant-...   (only if BRIEFING_BACKEND=api)
#   3. Settings → Pages → Source: GitHub Actions
#   4. Edit config.yaml with your topics and sources
#   5. Push — your next scheduled run will generate a live briefing
#
# Cost controls (env on the "Generate briefing" step):
#   BRIEFING_BACKEND=pro       → Claude Pro via Claude Code only (no API fallback).
#   BRIEFING_BACKEND=api       → API key only (per-token console billing).
#   BRIEFING_PROFILE=economy   → apply web-search caps + alternate-day deep dive.
#
#   6. For a reliable 5:07 AM UK run: point cron-job.org (or similar) at
#      workflow_dispatch. GitHub's own cron is only a late backup.

name: Morning Briefing

on:
  # Late backup only. GitHub's scheduler for this repo is hours late; do not
  # use it as the 5am alarm. The skip gate avoids a second Claude call.
  schedule:
    - cron: '11 10 * * 1-5'

  workflow_dispatch:
    inputs:
      force:
        description: 'Force regenerate today even if already exists'
        type: boolean
        default: false

  repository_dispatch:
    types: [morning-briefing]

permissions:
  contents: write   # to commit the generated HTML back to the repo
  pages: write      # to deploy to GitHub Pages
  id-token: write   # required by actions/deploy-pages

# If a late GitHub cron overlaps a run already in progress, wait — do not
# start a second Claude job. The second run will then see today's file and skip.
concurrency:
  group: morning-briefing
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if today's briefing already exists
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(TZ=Europe/London date +%Y-%m-%d)
          if [ -f "docs/briefing-${today}.html" ]; then
            echo "Already generated for ${today}; skipping Claude."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Install Claude Code
        if: steps.gate.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Create output directory
        if: steps.gate.outputs.run == 'true'
        run: mkdir -p docs

      - name: Copy static assets
        if: steps.gate.outputs.run == 'true'
        run: |
          [ -f setup.html ] && cp setup.html docs/setup.html || true

      - name: Generate briefing
        if: steps.gate.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRIEFING_BACKEND: pro
          BRIEFING_PROFILE: economy
          BRIEFING_OUTPUT_DIR: docs
        run: python morning_dashboard_v4.py ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Commit generated files
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name  "Morning Briefing Bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Briefing: $(date -u +%Y-%m-%d)"
          git push

      - name: Upload Pages artifact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        if: steps.gate.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
